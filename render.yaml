services:
  - type: web
    name: scs-mailusa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCS_MAILUSA_USERNAME
        value: scs admin
      - key: SCS_MAILUSA_PASSWORD
        value: "123456"
