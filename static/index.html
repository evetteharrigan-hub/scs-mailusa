<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCS-MAILUSA - Safe Cargo Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'asian-red': '#C0392B',
                        'asian-crimson': '#E74C3C',
                        'asian-gold': '#F39C12',
                        'asian-gold-dark': '#D4AC0D',
                        'asian-maroon': '#8B0000',
                        'asian-maroon-deep': '#7B0D0D',
                        'asian-cream': '#FAF8F5',
                        'asian-charcoal': '#2C3E50',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FAF8F5; }
        .drop-zone { transition: all 0.3s ease; }
        .drop-zone.dragover { border-color: #C0392B; background-color: #fef2f2; transform: scale(1.01); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { border-bottom: 3px solid #F39C12; color: #F39C12; font-weight: 600; }
        .tab-inactive { border-bottom: 3px solid transparent; color: rgba(255,255,255,0.6); }
        .tab-inactive:hover { color: rgba(255,255,255,0.9); border-color: rgba(243,156,18,0.4); }
        .header-pattern {
            background: linear-gradient(135deg, #7B0D0D 0%, #8B0000 50%, #7B0D0D 100%);
            position: relative;
            overflow: hidden;
        }
        .header-pattern::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 100%;
            background: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 10px,
                rgba(243,156,18,0.05) 10px,
                rgba(243,156,18,0.05) 20px
            );
        }
        .header-pattern::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #D4AC0D, #F39C12, #D4AC0D);
        }
        .section-header { border-left: 4px solid #F39C12; padding-left: 12px; }
        .card-warm {
            background: white;
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.06), 0 1px 3px rgba(0,0,0,0.04);
            border: 1px solid rgba(212,172,13,0.12);
        }
        .input-warm {
            border-color: #e8dfd3;
            transition: all 0.2s ease;
        }
        .input-warm:focus {
            border-color: #C0392B;
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.12);
            outline: none;
        }
        .table-header-red {
            background-color: #8B0000;
            color: white;
        }
        .table-row-alt:nth-child(even) {
            background-color: #FAF8F5;
        }
        .table-row-alt:nth-child(odd) {
            background-color: white;
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useCallback, useEffect } = React;

        // ─── Waybills Tab ──────────────────────────────────────────────
        function WaybillsTab({ info, setInfo, onGenerated }) {
            const [step, setStep] = useState(1);
            const [xlsxFile, setXlsxFile] = useState(null);
            const [parsedRows, setParsedRows] = useState([]);
            const [loading, setLoading] = useState(false);
            const [generating, setGenerating] = useState(false);
            const [error, setError] = useState('');
            const xlsxRef = useRef(null);

            // PDF Splitter state
            const [splitterPdf, setSplitterPdf] = useState(null);
            const [splitting, setSplitting] = useState(false);
            const [splitSuccess, setSplitSuccess] = useState('');
            const [splitError, setSplitError] = useState('');
            const splitterRef = useRef(null);

            const handleChange = (field, value) => setInfo(prev => ({ ...prev, [field]: value }));

            const handleXlsx = useCallback((e) => {
                e.preventDefault();
                e.currentTarget.classList && e.currentTarget.classList.remove('dragover');
                const file = e.dataTransfer?.files[0] || e.target.files?.[0];
                if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) {
                    setXlsxFile(file);
                    setError('');
                } else {
                    setError('Please upload an Excel file (.xlsx)');
                }
            }, []);

            const dragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('dragover'); };
            const dragLeave = (e) => { e.currentTarget.classList.remove('dragover'); };

            const goStep2 = () => {
                if (!info.master_awb.trim()) { setError('Master AWB / BOL Number is required'); return; }
                setError(''); setStep(2);
            };

            const goStep3 = async () => {
                if (!xlsxFile) { setError('Please upload a spreadsheet'); return; }
                setLoading(true); setError('');
                const fd = new FormData();
                fd.append('xlsx_file', xlsxFile);
                fd.append('master_awb', info.master_awb);
                fd.append('voyage_number', info.voyage_number);
                fd.append('date_of_departure', info.date_of_departure);
                fd.append('carrier_name', info.carrier_name);
                try {
                    const res = await fetch('/preview', { method: 'POST', body: fd });
                    if (res.ok) {
                        const data = await res.json();
                        setParsedRows(data.rows || []);
                        setStep(3);
                    } else {
                        const err = await res.json();
                        setError(err.detail || 'Failed to parse spreadsheet');
                    }
                } catch (e) {
                    setError('Failed to connect to server.');
                }
                setLoading(false);
            };

            const generate = async () => {
                setGenerating(true); setError('');
                const fd = new FormData();
                fd.append('xlsx_file', xlsxFile);
                fd.append('master_awb', info.master_awb);
                fd.append('voyage_number', info.voyage_number);
                fd.append('date_of_departure', info.date_of_departure);
                fd.append('carrier_name', info.carrier_name);
                try {
                    const res = await fetch('/generate-waybills', { method: 'POST', body: fd });
                    if (res.ok) {
                        const blob = await res.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        const disp = res.headers.get('Content-Disposition');
                        a.download = disp ? disp.split('filename=')[1] : 'waybills.zip';
                        document.body.appendChild(a); a.click(); a.remove();
                        window.URL.revokeObjectURL(url);
                        onGenerated('Waybills', info, xlsxFile?.name || '', parsedRows.length, parsedRows);
                    } else {
                        const err = await res.json();
                        setError(err.detail || 'Generation failed');
                    }
                } catch (e) {
                    setError('Failed to generate waybills.');
                }
                setGenerating(false);
            };

            return (
                <div className="fade-in">
                    {/* Steps indicator */}
                    <div className="flex justify-center mb-6">
                        <div className="flex items-center space-x-3">
                            {[1,2,3].map(s => (
                                <React.Fragment key={s}>
                                    <div className={`flex items-center justify-center w-9 h-9 rounded-full text-sm font-bold ${step >= s ? 'bg-asian-red text-white' : 'bg-gray-200 text-gray-500'}`}>
                                        {step > s ? <i className="fas fa-check text-xs"></i> : s}
                                    </div>
                                    {s < 3 && <div className={`w-12 h-0.5 rounded ${step > s ? 'bg-asian-red' : 'bg-gray-200'}`}></div>}
                                </React.Fragment>
                            ))}
                        </div>
                    </div>

                    {error && (
                        <div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-center text-sm">
                            <i className="fas fa-exclamation-circle mr-2"></i>{error}
                            <button onClick={() => setError('')} className="ml-auto text-red-500 hover:text-red-700"><i className="fas fa-times"></i></button>
                        </div>
                    )}

                    {/* Step 1: Shipment Info */}
                    {step === 1 && (
                        <div className="card-warm rounded-lg p-6">
                            <h3 className="section-header text-lg font-semibold text-asian-maroon mb-4">
                                <i className="fas fa-clipboard-list text-asian-gold mr-2"></i>Shipment Information
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-sm font-medium text-asian-charcoal mb-1">Master AWB / BOL <span className="text-asian-crimson">*</span></label>
                                    <input type="text" value={info.master_awb} onChange={(e) => handleChange('master_awb', e.target.value)}
                                        className="input-warm w-full px-4 py-2 border rounded-lg" placeholder="e.g., 176-12345678" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-asian-charcoal mb-1">Voyage / Flight Number</label>
                                    <input type="text" value={info.voyage_number} onChange={(e) => handleChange('voyage_number', e.target.value)}
                                        className="input-warm w-full px-4 py-2 border rounded-lg" placeholder="e.g., AA1234" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-asian-charcoal mb-1">Date of Departure</label>
                                    <input type="date" value={info.date_of_departure} onChange={(e) => handleChange('date_of_departure', e.target.value)}
                                        className="input-warm w-full px-4 py-2 border rounded-lg" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-asian-charcoal mb-1">Carrier / Vessel Name</label>
                                    <input type="text" value={info.carrier_name} onChange={(e) => handleChange('carrier_name', e.target.value)}
                                        className="input-warm w-full px-4 py-2 border rounded-lg" placeholder="e.g., TROPICAL SHIPPING" />
                                </div>
                            </div>
                            <div className="mt-6 flex justify-end">
                                <button onClick={goStep2} className="px-5 py-2 bg-asian-maroon text-asian-gold font-medium rounded-lg hover:bg-asian-maroon-deep flex items-center transition-colors">
                                    Next <i className="fas fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Step 2: Upload XLSX */}
                    {step === 2 && (
                        <div className="card-warm rounded-lg p-6">
                            <h3 className="section-header text-lg font-semibold text-asian-maroon mb-4">
                                <i className="fas fa-file-excel text-asian-gold mr-2"></i>Upload Shipment Spreadsheet
                            </h3>
                            <div className="drop-zone border-2 border-dashed border-asian-red rounded-lg p-8 text-center cursor-pointer bg-asian-cream hover:bg-red-50"
                                onDrop={handleXlsx} onDragOver={dragOver} onDragLeave={dragLeave} onClick={() => xlsxRef.current?.click()}>
                                {xlsxFile ? (
                                    <div className="text-asian-maroon">
                                        <i className="fas fa-file-excel text-4xl mb-2 text-asian-gold"></i>
                                        <p className="font-medium">{xlsxFile.name}</p>
                                        <p className="text-sm text-gray-500">{(xlsxFile.size / 1024).toFixed(1)} KB</p>
                                    </div>
                                ) : (
                                    <div className="text-asian-red opacity-60">
                                        <i className="fas fa-file-upload text-4xl mb-2"></i>
                                        <p className="font-medium">Drop Excel file here or click to browse</p>
                                        <p className="text-sm">Supports .xlsx files</p>
                                    </div>
                                )}
                            </div>
                            <input ref={xlsxRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleXlsx} />
                            <div className="mt-6 flex justify-between">
                                <button onClick={() => setStep(1)} className="px-5 py-2 bg-gray-100 text-asian-charcoal rounded-lg hover:bg-gray-200 flex items-center transition-colors">
                                    <i className="fas fa-arrow-left mr-2"></i>Back
                                </button>
                                <button onClick={goStep3} disabled={loading} className="px-5 py-2 bg-asian-maroon text-asian-gold font-medium rounded-lg hover:bg-asian-maroon-deep flex items-center disabled:opacity-50 transition-colors">
                                    {loading ? <><i className="fas fa-spinner fa-spin mr-2"></i>Parsing...</> : <>Preview <i className="fas fa-arrow-right ml-2"></i></>}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Step 3: Preview & Generate */}
                    {step === 3 && (
                        <div className="card-warm rounded-lg p-6">
                            <h3 className="section-header text-lg font-semibold text-asian-maroon mb-4">
                                <i className="fas fa-table text-asian-gold mr-2"></i>Preview & Generate
                            </h3>
                            <div className="bg-red-50 border border-red-100 rounded-lg p-3 mb-4 flex items-center justify-between text-sm">
                                <span className="text-asian-maroon font-medium"><i className="fas fa-info-circle mr-1"></i>{parsedRows.length} row{parsedRows.length !== 1 ? 's' : ''} found</span>
                                <span className="text-asian-red">{parsedRows.length} waybill XML{parsedRows.length !== 1 ? 's' : ''} will be generated</span>
                            </div>
                            <div className="overflow-x-auto border border-asian-gold-dark/20 rounded-lg max-h-64 overflow-y-auto">
                                <table className="w-full text-sm">
                                    <thead className="table-header-red sticky top-0">
                                        <tr>
                                            <th className="px-3 py-2 text-left font-medium">#</th>
                                            <th className="px-3 py-2 text-left font-medium">Tracking</th>
                                            <th className="px-3 py-2 text-left font-medium">Buyer</th>
                                            <th className="px-3 py-2 text-left font-medium">Weight</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {parsedRows.map((row, i) => (
                                            <tr key={i} className="table-row-alt hover:bg-yellow-50 transition-colors">
                                                <td className="px-3 py-1.5 text-gray-500">{i + 1}</td>
                                                <td className="px-3 py-1.5 font-mono text-xs">{row.tracking_number || '-'}</td>
                                                <td className="px-3 py-1.5">{row.buyer_name || '-'}</td>
                                                <td className="px-3 py-1.5">{row.weight || '-'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div className="mt-6 flex justify-between">
                                <button onClick={() => setStep(2)} className="px-5 py-2 bg-gray-100 text-asian-charcoal rounded-lg hover:bg-gray-200 flex items-center transition-colors">
                                    <i className="fas fa-arrow-left mr-2"></i>Back
                                </button>
                                <button onClick={generate} disabled={generating} className="px-6 py-2.5 bg-asian-maroon text-asian-gold font-bold rounded-lg hover:bg-asian-maroon-deep flex items-center disabled:opacity-50 transition-colors">
                                    {generating ? <><i className="fas fa-spinner fa-spin mr-2"></i>Generating...</> : <><i className="fas fa-download mr-2"></i>Download Waybills ZIP</>}
                                </button>
                            </div>
                        </div>
                    )}
                    {/* ─── PDF WAYBILL SPLITTER ─── */}
                    <div className="mt-8 card-warm rounded-lg p-6">
                        <h3 className="section-header text-lg font-semibold text-asian-maroon mb-4">
                            <i className="fas fa-cut text-asian-gold mr-2"></i>PDF WAYBILL SPLITTER
                        </h3>
                        <p className="text-sm text-gray-500 mb-4">Drop a ZIP of invoices or individual PDF files here</p>

                        {splitError && (
                            <div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-center text-sm">
                                <i className="fas fa-exclamation-circle mr-2"></i>{splitError}
                                <button onClick={() => setSplitError('')} className="ml-auto text-red-500 hover:text-red-700"><i className="fas fa-times"></i></button>
                            </div>
                        )}

                        {splitSuccess && (
                            <div className="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg flex items-center text-sm">
                                <i className="fas fa-check-circle mr-2"></i>{splitSuccess}
                                <button onClick={() => setSplitSuccess('')} className="ml-auto text-green-500 hover:text-green-700"><i className="fas fa-times"></i></button>
                            </div>
                        )}

                        <div
                            className="drop-zone border-2 border-dashed border-asian-red rounded-lg p-8 text-center cursor-pointer bg-asian-cream hover:bg-red-50"
                            onDrop={(e) => {
                                e.preventDefault();
                                e.currentTarget.classList.remove('dragover');
                                const file = e.dataTransfer?.files[0];
                                if (file && file.name.toLowerCase().endsWith('.pdf')) {
                                    setSplitterPdf(file);
                                    setSplitError('');
                                    setSplitSuccess('');
                                } else {
                                    setSplitError('Please upload a PDF file');
                                }
                            }}
                            onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add('dragover'); }}
                            onDragLeave={(e) => { e.currentTarget.classList.remove('dragover'); }}
                            onClick={() => splitterRef.current?.click()}
                        >
                            {splitterPdf ? (
                                <div className="text-asian-maroon">
                                    <i className="fas fa-file-pdf text-4xl mb-2 text-asian-gold"></i>
                                    <p className="font-medium">{splitterPdf.name}</p>
                                    <p className="text-sm text-gray-500">{(splitterPdf.size / 1024).toFixed(1)} KB</p>
                                </div>
                            ) : (
                                <div className="text-asian-red opacity-60">
                                    <i className="fas fa-file-pdf text-4xl mb-2"></i>
                                    <p className="font-medium">Upload Batch Waybill or Invoice PDF</p>
                                    <p className="text-sm">Drop PDF here or click to browse</p>
                                </div>
                            )}
                        </div>
                        <input ref={splitterRef} type="file" accept=".pdf" className="hidden" onChange={(e) => {
                            const file = e.target.files?.[0];
                            if (file && file.name.toLowerCase().endsWith('.pdf')) {
                                setSplitterPdf(file);
                                setSplitError('');
                                setSplitSuccess('');
                            }
                        }} />

                        <div className="mt-4 flex justify-end">
                            <button
                                onClick={async () => {
                                    if (!splitterPdf) { setSplitError('Please upload a PDF file first'); return; }
                                    setSplitting(true); setSplitError(''); setSplitSuccess('');
                                    const fd = new FormData();
                                    fd.append('waybill_pdf', splitterPdf);
                                    try {
                                        const res = await fetch('/split-waybills-pdf', { method: 'POST', body: fd });
                                        if (res.ok) {
                                            const pageCount = res.headers.get('X-Page-Count') || '?';
                                            const blob = await res.blob();
                                            const url = window.URL.createObjectURL(blob);
                                            const a = document.createElement('a');
                                            a.href = url;
                                            a.download = 'split_waybills.zip';
                                            document.body.appendChild(a); a.click(); a.remove();
                                            window.URL.revokeObjectURL(url);
                                            setSplitSuccess(`Successfully split PDF into ${pageCount} individual waybill pages`);
                                        } else {
                                            const err = await res.json().catch(() => ({}));
                                            setSplitError(err.detail || 'Failed to split PDF');
                                        }
                                    } catch (e) {
                                        setSplitError('Failed to connect to server.');
                                    }
                                    setSplitting(false);
                                }}
                                disabled={splitting || !splitterPdf}
                                className="px-6 py-2.5 bg-asian-maroon text-asian-gold font-bold rounded-lg hover:bg-asian-maroon-deep flex items-center disabled:opacity-50 transition-colors"
                            >
                                {splitting ? <><i className="fas fa-spinner fa-spin mr-2"></i>Splitting...</> : <><i className="fas fa-cut mr-2"></i>Split &amp; Download</>}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }


        // ─── Declarations Tab ──────────────────────────────────────────
        function DeclarationsTab({ info, setInfo, onGenerated, onDutiesChanged, restoredData, restoredDutiesMap, onRestoredDataUsed }) {
            const [step, setStep] = useState(1);
            const [xlsxFile, setXlsxFile] = useState(null);
            const [invoiceZip, setInvoiceZip] = useState(null);
            const [parsedRows, setParsedRows] = useState([]);
            const [loading, setLoading] = useState(false);
            const [generating, setGenerating] = useState(false);
            const [error, setError] = useState('');
            const [declarationsGenerated, setDeclarationsGenerated] = useState(false);
            const [showStep3, setShowStep3] = useState(false);
            const [restoredRows, setRestoredRows] = useState([]);
            React.useEffect(() => {
                if (restoredData && restoredData.length > 0) {
                    setRestoredRows(restoredData);
                    setParsedRows([]);
                    setXlsxFile(null);
                    setDutiesMap(restoredDutiesMap || {});
                    setError('');
                    setShowStep3(true);
                    setStep(3);
                    if (onRestoredDataUsed) onRestoredDataUsed();
                }
            }, [restoredData]);
            const [dutiesMap, setDutiesMap] = useState({});
            const [paymentOrderSuccess, setPaymentOrderSuccess] = useState('');
            const [uploadingPaymentOrder, setUploadingPaymentOrder] = useState(false);
            const invoiceRows = restoredRows.length ? restoredRows : parsedRows;
            const [arrivalDate, setArrivalDate] = useState('');
            const [generatingInvoices, setGeneratingInvoices] = useState(false);
            const xlsxRef = useRef(null);
            const zipRef = useRef(null);

            const handleChange = (field, value) => setInfo(prev => ({ ...prev, [field]: value }));

            const handleXlsx = useCallback((e) => {
                e.preventDefault();
                e.currentTarget.classList && e.currentTarget.classList.remove('dragover');
                const file = e.dataTransfer?.files[0] || e.target.files?.[0];
                if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) {
                    setXlsxFile(file);
                    setRestoredRows([]);
                    setShowStep3(false);
                    setError('');
                } else {
                    setError('Please upload an Excel file (.xlsx)');
                }
            }, []);

            const handleInvoiceZip = useCallback((e) => {
                e.preventDefault();
                e.currentTarget.classList && e.currentTarget.classList.remove('dragover');
                const file = e.dataTransfer?.files[0] || e.target.files?.[0];
                if (file && file.name.toLowerCase().endsWith('.zip')) {
                    setInvoiceZip(file);
                    setError('');
                } else if (file) {
                    setError('Please upload a ZIP file containing invoice PDFs');
                }
            }, []);

            const dragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('dragover'); };
            const dragLeave = (e) => { e.currentTarget.classList.remove('dragover'); };

            const goStep2 = () => {
                if (!info.master_awb.trim()) { setError('Master AWB / BOL Number is required'); return; }
                if (!info.manifest_reference.trim()) { setError('Manifest Reference is required (obtain from ASYCUDA after uploading waybills)'); return; }
                setError(''); setStep(2);
            };

            const goStep3 = async () => {
                if (!xlsxFile) { setError('Please upload a spreadsheet'); return; }
                setLoading(true); setError('');
                const fd = new FormData();
                fd.append('xlsx_file', xlsxFile);
                fd.append('master_awb', info.master_awb);
                fd.append('voyage_number', info.voyage_number);
                fd.append('date_of_departure', info.date_of_departure);
                fd.append('carrier_name', info.carrier_name);
                fd.append('manifest_reference', info.manifest_reference);
                try {
                    const res = await fetch('/preview', { method: 'POST', body: fd });
                    if (res.ok) {
                        const data = await res.json();
                        setParsedRows(data.rows || []);
                        setStep(3);
                    } else {
                        const err = await res.json();
                        setError(err.detail || 'Failed to parse spreadsheet');
                    }
                } catch (e) {
                    setError('Failed to connect to server.');
                }
                setLoading(false);
            };

            const generate = async () => {
                setGenerating(true); setError('');
                const fd = new FormData();
                fd.append('xlsx_file', xlsxFile);
                fd.append('master_awb', info.master_awb);
                fd.append('manifest_reference', info.manifest_reference);
                fd.append('voyage_number', info.voyage_number);
                fd.append('date_of_departure', info.date_of_departure);
                fd.append('carrier_name', info.carrier_name);
                if (invoiceZip) fd.append('invoice_zip', invoiceZip);
                if (arrivalDate) fd.append('arrival_date', arrivalDate);
                try {

                        const url = window.URL.createObjectURL(blob);

                        a.href = url;

                        a.download = disp ? disp.split('filename=')[1] : 'declarations.zip';

            const handleDutyChange = (tracking, value) => {

            const uploadPaymentOrder = async (file) => {
                setPaymentOrderSuccess('');
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    setError('Please upload a PDF payment order.');
                    return;
                }
                setUploadingPaymentOrder(true);
                setError('');
                const fd = new FormData();
                fd.append('pdf_file', file);
                try {
                    const res = await fetch('/parse-payment-order', { method: 'POST', body: fd });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        setError(err.detail || 'Failed to parse payment order.');
                    } else {
                        const matches = await res.json();
                        const updates = {};
                        for (const match of matches) {
                            if (!match.digits || !Number.isFinite(Number(match.amount_ec))) continue;
                            for (const row of invoiceRows) {
                                const tracking = row.tracking_number;
                                if (tracking && String(tracking).includes(String(match.digits))) {
                                    updates[tracking] = match.amount_ec;
                                }
                            }
                        }
                        const count = Object.keys(updates).length;
                        if (count) {
                            const next = { ...dutiesMap, ...updates };
                            setDutiesMap(next);
                            onDutiesChanged(info, invoiceRows, next);
                            setPaymentOrderSuccess(`✓ ${count} duties auto-filled from payment order`);

        // ─── Manifest Tab ──────────────────────────────────────────────
        function ManifestTab() {
            const [arrivalDate, setArrivalDate] = useState('');
            const [manifestNumber, setManifestNumber] = useState('');
            const [xlsxFile, setXlsxFile] = useState(null);
            const [generating, setGenerating] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const xlsxRef = useRef(null);

            const handleXlsx = useCallback((e) => {
                e.preventDefault();
                e.currentTarget.classList && e.currentTarget.classList.remove('dragover');
                const file = e.dataTransfer?.files[0] || e.target.files?.[0];
                if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) {
                    setXlsxFile(file);
                    setError('');
                } else {
                    setError('Please upload an Excel file (.xlsx)');
                }
            }, []);

            const dragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('dragover'); };
            const dragLeave = (e) => { e.currentTarget.classList.remove('dragover'); };

            const generateManifest = async () => {
                if (!arrivalDate.trim()) { setError('Date of Arrival is required.'); return; }
                if (!manifestNumber.trim()) { setError('Manifest Number is required.'); return; }
                if (!xlsxFile) { setError('Please upload a spreadsheet.'); return; }

                setGenerating(true);
                setError('');
                setSuccess('');

                try {
                    const fd = new FormData();
                    fd.append('xlsx_file', xlsxFile);
                    fd.append('arrival_date', arrivalDate);
                    fd.append('manifest_number', manifestNumber);

                    const res = await fetch('/generate-manifest', { method: 'POST', body: fd });
                    if (res.ok) {
                        const blob = await res.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        const disp = res.headers.get('Content-Disposition');
                        a.download = disp ? disp.split('filename=')[1].replace(/"/g, '') : `SCS_Manifest_${manifestNumber}.pdf`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(url);
                        setSuccess('Manifest PDF generated and downloaded successfully!');
                    } else {
                        const err = await res.json();
                        setError(err.detail || 'Failed to generate manifest.');
                    }
                } catch (e) {
                    setError('Failed to connect to server.');
                }
                setGenerating(false);
            };

            return (
                <div className="fade-in">
                    <div className="card-warm rounded-lg p-6">
                        <h3 className="section-header text-lg font-semibold text-asian-maroon mb-4">
                            <i className="fas fa-clipboard-list text-asian-gold mr-2"></i>Manifest Details
                        </h3>

                        {error && (
                            <div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg flex items-center text-sm">
                                <i className="fas fa-exclamation-circle mr-2"></i>{error}
                                <button onClick={() => setError('')} className="ml-auto text-red-500 hover:text-red-700"><i className="fas fa-times"></i></button>
                            </div>
                        )}

                        {success && (
                            <div className="mb-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg flex items-center text-sm">
                                <i className="fas fa-check-circle mr-2"></i>{success}
                                <button onClick={() => setSuccess('')} className="ml-auto text-green-500 hover:text-green-700"><i className="fas fa-times"></i></button>
                            </div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
                            <div>
                                <label className="block text-sm font-medium text-asian-charcoal mb-1">Date of Arrival <span className="text-asian-crimson">*</span></label>
                                <input type="date" value={arrivalDate} onChange={(e) => setArrivalDate(e.target.value)}
                                    className="input-warm w-full px-4 py-2 border rounded-lg" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-asian-charcoal mb-1">Manifest Number <span className="text-asian-crimson">*</span></label>
                                <input type="text" value={manifestNumber} onChange={(e) => setManifestNumber(e.target.value)}
                                    className="input-warm w-full px-4 py-2 border rounded-lg" placeholder="e.g., MAN-2026-001" />
                            </div>
                        </div>

                        <h3 className="section-header text-lg font-semibold text-asian-maroon mb-4 mt-6">
                            <i className="fas fa-file-excel text-asian-gold mr-2"></i>Shipment Spreadsheet
                        </h3>
                        <div className="drop-zone border-2 border-dashed border-asian-red rounded-lg p-8 text-center cursor-pointer bg-asian-cream hover:bg-red-50"
                            onDrop={handleXlsx} onDragOver={dragOver} onDragLeave={dragLeave} onClick={() => xlsxRef.current?.click()}>
                            {xlsxFile ? (
                                <div className="text-asian-maroon">
                                    <i className="fas fa-file-excel text-4xl mb-2 text-asian-gold"></i>
                                    <p className="font-medium">{xlsxFile.name}</p>
                                    <p className="text-sm text-gray-500">{(xlsxFile.size / 1024).toFixed(1)} KB</p>
                                </div>
                            ) : (
                                <div className="text-asian-red opacity-60">
                                    <i className="fas fa-file-upload text-4xl mb-2"></i>
                                    <p className="font-medium">Drop Excel file here or click to browse</p>
                                    <p className="text-sm">Supports .xlsx files</p>
                                </div>
                            )}
                        </div>
                        <input ref={xlsxRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={handleXlsx} />

                        <div className="mt-6 flex justify-end">
                            <button onClick={generateManifest} disabled={generating}
                                className="px-6 py-2.5 bg-asian-maroon text-asian-gold font-bold rounded-lg hover:bg-asian-maroon-deep flex items-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                                <i className={generating ? "fas fa-spinner fa-spin mr-2" : "fas fa-file-pdf mr-2"}></i>
                                {generating ? 'Generating...' : 'Generate Manifest'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ─── Login Page ────────────────────────────────────────────────
        function LoginPage({ onLogin }) {

            const [error, setError] = useState('');

                        setError('Invalid username or password');

                    setError('Failed to connect to server.');

                setLoading(false);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <div className="header-pattern text-center py-10">

                            SCS-MAILUSA
                        </h1>
                        <p className="text-yellow-100/80 mt-2 text-sm tracking-wide">Safe Cargo Services · Anguilla</p>

                    <div className="flex-1 flex items-center justify-center px-4 py-12">

                            </form>
                        </div>
                    </div>
                </div>
            );
        }


        // ─── Session History ──────────────────────────────────────────
        function HistoryTab({ history, loading, error, onLoad, onDelete, onClear }) {
            return (
                <div className="fade-in">
                    <div className="flex flex-wrap items-start justify-between gap-4 mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-asian-maroon">SESSION HISTORY</h2>
                            <p className="text-sm text-gray-500 mt-1">Click any entry to restore shipment details</p>
                        </div>

                            <button onClick={onClear} className="text-xs border border-asian-red text-asian-red px-3 py-2 rounded-lg hover:bg-red-50 transition-colors">
                                Clear All History
                            </button>
                        )}
                    </div>
                    {error && history.length > 0 && <p className="text-sm text-red-700 mb-4" role="alert">{error}</p>}
                    {loading ? (
                        <div className="text-sm text-gray-500 py-8 text-center" role="status">Loading session history...</div>
                    ) : history.length === 0 ? (
                        <div className="card-warm rounded-lg p-10 text-center text-gray-500">{error || 'No history yet. Generated sessions will appear here.'}</div>
                    ) : (
                        <div className="space-y-4">
                            {history.map(entry => (
                                <div key={entry.id} role="button" tabIndex={0}
                                    onClick={() => onLoad(entry)}
                                    onKeyDown={(e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); onLoad(entry); } }}
                                    className="card-warm rounded-lg p-5 cursor-pointer hover:border-asian-gold focus:outline-none focus:ring-2 focus:ring-asian-gold transition-colors">
                                    <div className="flex flex-wrap items-center gap-3 mb-3">
                                        <strong className="text-asian-maroon">{entry.date}</strong>
                                        <span className="bg-asian-gold/20 text-asian-maroon text-xs font-bold uppercase rounded-full px-3 py-1">{entry.type}</span>
                                    </div>
                                    <p className="text-sm text-asian-charcoal break-words">
                                        <span className="font-medium">Master AWB:</span> {entry.master_awb || '—'} <span className="text-gray-300 mx-2">|</span>
                                        <span className="font-medium">Voyage:</span> {entry.voyage_number || '—'} <span className="text-gray-300 mx-2">|</span>
                                        <span className="font-medium">Carrier:</span> {entry.carrier_name || '—'}
                                    </p>
                                    <p className="text-sm text-gray-500 mt-2 break-all">Spreadsheet: {entry.spreadsheet_name || '—'} ({entry.row_count || 0} rows)</p>
                                    <div className="flex gap-3 mt-4">
                                        <button onClick={(e) => { e.stopPropagation(); onLoad(entry); }}
                                            className="px-4 py-2 bg-asian-maroon text-asian-gold text-sm font-semibold rounded-lg hover:bg-asian-maroon-deep">Load Details</button>
                                        {Array.isArray(entry.rows) && entry.rows.length > 0 && (
                                            <button onClick={(e) => { e.stopPropagation(); onLoad(entry, true); }}
                                                className="px-4 py-2 bg-asian-red text-white text-sm font-semibold rounded-lg hover:bg-asian-maroon">Enter Duties & Create Invoices</button>
                                        )}
                                        <button onClick={(e) => { e.stopPropagation(); onDelete(entry.id); }}
                                            className="px-4 py-2 border border-asian-red text-asian-red text-sm rounded-lg hover:bg-red-50">Delete</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ─── Main App with Tabs ────────────────────────────────────────
        function MainApp({ onSignOut }) {
            const [activeTab, setActiveTab] = useState('waybills');
            const [waybillForm, setWaybillForm] = useState({ master_awb: '', voyage_number: '', date_of_departure: '', carrier_name: '' });
            const [decForm, setDecForm] = useState({ master_awb: '', manifest_reference: '', voyage_number: '', date_of_departure: '', carrier_name: '' });
            const [history, setHistory] = useState([]);
            const [restoredDecData, setRestoredDecData] = useState([]);
            const [restoredDutiesMap, setRestoredDutiesMap] = useState({});
            const [restoredHistoryId, setRestoredHistoryId] = useState(null);
            

            const [historyLoading, setHistoryLoading] = useState(true);
            const [historyError, setHistoryError] = useState('');

            useEffect(() => {
                let mounted = true;
                const fetchHistory = async () => {
                    try {
                        const res = await fetch('/api/history');
                        if (!res.ok) throw new Error('Could not load session history. Please try again later.');
                        const entries = await res.json();
                        if (mounted) setHistory(Array.isArray(entries) ? entries : []);
                    } catch (e) {
                        if (mounted) setHistoryError('Could not load session history. Please try again later.');
                    } finally {
                        if (mounted) setHistoryLoading(false);
                    }
                };
                fetchHistory();
                return () => { mounted = false; };
            }, []);

            const saveToHistory = async (entry) => {
                try {
                    const res = await fetch('/api/history', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(entry)
                    });
                    if (!res.ok) throw new Error('Could not save session history.');
                    const saved = await res.json();
                    setHistory(prev => prev.some(item => item.id === saved.id)
                        ? prev.map(item => item.id === saved.id ? saved : item)
                        : [saved, ...prev].slice(0, 50));
                    setHistoryError('');
                } catch (e) {
                    setHistoryError('Could not save session history.');
                }
            };

            const handleGenerated = (type, info, spreadsheetName, rowCount, rows = [], dutiesMap = {}) => {
                const hasWaybills = type === 'Declarations' && history.some(item =>
                    (item.type === 'Waybills' || item.type === 'Waybills + Declarations') &&
                    item.master_awb === info.master_awb && item.spreadsheet_name === spreadsheetName
                );
                const now = new Date();
                saveToHistory({
                    id: `${now.getTime()}-${Math.random().toString(36).slice(2)}`,
                    date: new Intl.DateTimeFormat('sv-SE', {
                        timeZone: 'America/Anguilla', year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
                    }).format(now),
                    type: hasWaybills ? 'Waybills + Declarations' : type,
                    master_awb: info.master_awb || '',
                    voyage_number: info.voyage_number || '',
                    date_of_departure: info.date_of_departure || '',
                    carrier_name: info.carrier_name || '',
                    manifest_reference: info.manifest_reference || '',
                    spreadsheet_name: spreadsheetName,
                    row_count: rowCount,
                    ...(Object.keys(dutiesMap).length ? { dutiesMap } : {}),
                    rows: rows.map(r => ({
                        tracking_number: r.tracking_number || r['Tracking Number'] || '',
                        buyer_name: r.buyer_name || r['Buyer Name'] || '',
                        buyer_address1: r.buyer_address1 || r['Buyer Address1'] || '',
                        buyer_city: r.buyer_city || r['Buyer City'] || '',
                        buyer_state: r.buyer_state || r['Buyer State'] || '',
                        buyer_phone: r.buyer_phone || r['Buyer Phone'] || '',
                        buyer_email: r.buyer_email || r['Buyer Email'] || '',
                        shipper: r.shipper || r['Shipper'] || '',
                        cn35_awb: r.cn35_awb || r['CN35 AWB'] || '',
                        items_description: r.items_description || r['Items Description'] || '',
                        fob_verified: r.fob_verified || r['Fob Verified'] || '0'
                    }))
                });
            };

            const saveDutiesToHistory = (info, rows, dutiesMap) => {
                const trackingNumbers = new Set(rows.map(row => row.tracking_number));
                const index = history.findIndex(entry =>
                    (!restoredHistoryId || entry.id === restoredHistoryId) &&
                    (entry.master_awb || '') === (info.master_awb || '') && Array.isArray(entry.rows) &&
                    entry.rows.some(row => trackingNumbers.has(row.tracking_number))
                );
                if (index < 0) return;
                saveToHistory({ ...history[index], dutiesMap });
            };

            const loadDetails = (entry, enterDuties = false) => {
                const details = {
                    master_awb: entry.master_awb || '',
                    voyage_number: entry.voyage_number || '',
                    date_of_departure: entry.date_of_departure || '',
                    carrier_name: entry.carrier_name || ''
                };
                setWaybillForm(details);
                setDecForm({ ...details, manifest_reference: entry.manifest_reference || '' });
                if (enterDuties && Array.isArray(entry.rows) && entry.rows.length > 0) {
                    setRestoredDecData(entry.rows);
                    setRestoredDutiesMap(entry.dutiesMap || {});
                    setRestoredHistoryId(entry.id);
                    setActiveTab('declarations');
                } else {
                    setRestoredDecData([]);
                    setRestoredHistoryId(null);
                    setActiveTab('waybills');
                }
            };
            const deleteHistory = async (id) => {
                try {
                    const res = await fetch(`/api/history/${encodeURIComponent(id)}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Could not delete session.');
                    setHistory(prev => prev.filter(entry => entry.id !== id));
                    setHistoryError('');
                } catch (e) {
                    setHistoryError('Could not delete session.');
                }
            };
            const clearHistory = async () => {
                try {
                    const res = await fetch('/api/history', { method: 'DELETE' });
                    if (!res.ok) throw new Error('Could not clear history.');
                    setHistory([]);
                    setHistoryError('');
                } catch (e) {
                    setHistoryError('Could not clear history.');
                }
            };

            return (
                <div className="max-w-5xl mx-auto px-4 py-0">
                    {/* Header */}
                    <div className="header-pattern text-center py-8 -mx-4 px-4 mb-0 rounded-b-lg relative">
                        <h1 className="text-3xl font-bold text-asian-gold tracking-widest">
                            <i className="fas fa-ship mr-3"></i>
                            SCS-MAILUSA
                        </h1>
                        <p className="text-yellow-100/80 mt-2 text-sm tracking-wide">Safe Cargo Services · Anguilla</p>
                        <a href="/portal?role=warehouse" target="_blank" rel="noopener"
                            title="Warehouse Portal"
                            className="absolute top-4 left-4 text-xs border border-asian-gold/40 text-asian-gold px-3 py-1.5 rounded-lg hover:bg-black/20 flex items-center transition-colors">
                            <i className="fas fa-warehouse mr-1.5"></i>Warehouse
                        </a>
                        <a href="/portal?role=accounting" target="_blank" rel="noopener"
                            title="Accounting Portal"
                            className="absolute top-14 left-4 text-xs border border-asian-gold/40 text-asian-gold px-3 py-1.5 rounded-lg hover:bg-black/20 flex items-center transition-colors">
                            <i className="fas fa-calculator mr-1.5"></i>Accounting
                        </a>
                        <button
                            onClick={onSignOut}
                            title="Sign Out"
                            className="absolute top-4 right-4 text-xs border border-asian-gold/40 text-asian-gold px-3 py-1.5 rounded-lg hover:bg-black/20 flex items-center transition-colors">
                            <i className="fas fa-sign-out-alt mr-1.5"></i>Sign Out
                        </button>
                    </div>

                    {/* Tabs */}
                    <div className="flex justify-start md:justify-center overflow-x-auto bg-asian-red rounded-b-lg -mx-4 px-4 shadow-md">
                        <button
                            onClick={() => setActiveTab('waybills')}
                            className={`shrink-0 whitespace-nowrap px-6 py-3 text-sm transition-colors uppercase tracking-wider ${activeTab === 'waybills' ? 'tab-active' : 'tab-inactive'}`}>
                            <i className="fas fa-file-alt mr-2"></i>House Waybills
                        </button>
                        <button
                            onClick={() => setActiveTab('declarations')}
                            className={`shrink-0 whitespace-nowrap px-6 py-3 text-sm transition-colors uppercase tracking-wider ${activeTab === 'declarations' ? 'tab-active' : 'tab-inactive'}`}>
                            <i className="fas fa-file-invoice mr-2"></i>Declarations
                        </button>
                        <button
                            onClick={() => setActiveTab('manifest')}
                            className={`shrink-0 whitespace-nowrap px-6 py-3 text-sm transition-colors uppercase tracking-wider ${activeTab === 'manifest' ? 'tab-active' : 'tab-inactive'}`}>
                            <i className="fas fa-clipboard-list mr-2"></i>Manifest
                        </button>
                        <button
                            onClick={() => setActiveTab('invoice')}
                            className={`shrink-0 whitespace-nowrap px-6 py-3 text-sm transition-colors uppercase tracking-wider ${activeTab === 'invoice' ? 'tab-active' : 'tab-inactive'}`}>
                            <i className="fas fa-receipt mr-2"></i>Customer Invoice
                        </button>
                        <button
                            onClick={() => setActiveTab('history')}
                            className={`shrink-0 whitespace-nowrap px-6 py-3 text-sm transition-colors uppercase tracking-wider ${activeTab === 'history' ? 'tab-active' : 'tab-inactive'}`}>
                            <i className="fas fa-history mr-2"></i>History
                        </button>
                    </div>

                    {/* Workflow hint */}
                    <div className="mb-6 mt-6 text-center text-xs text-gray-400">
                        {activeTab === 'waybills'
                            ? 'Step 1 of 2: Generate waybills, upload them to ASYCUDA, then proceed to Declarations.'
                            : activeTab === 'declarations'
                            ? 'Step 2 of 2: After waybills are registered in ASYCUDA, generate customs declarations here.'
                            : activeTab === 'manifest'
                            ? 'Generate a professional cargo manifest PDF from your shipment spreadsheet.'
                            : activeTab === 'history'
                            ? 'Saved sessions with customer rows can create invoices without re-uploading the spreadsheet.'
                            : 'Load saved customers, email collection notices, or generate an individual invoice PDF.'}
                    </div>

                    {/* Tab Content */}
                    {activeTab === 'waybills' ? <WaybillsTab info={waybillForm} setInfo={setWaybillForm} onGenerated={handleGenerated} />
                        : activeTab === 'declarations' ? <DeclarationsTab restoredData={restoredDecData} restoredDutiesMap={restoredDutiesMap} onRestoredDataUsed={() => setRestoredDecData([])} info={decForm} setInfo={setDecForm} onGenerated={handleGenerated} onDutiesChanged={saveDutiesToHistory} />
                        : activeTab === 'manifest' ? <ManifestTab />
                        : activeTab === 'history' ? <HistoryTab history={history} loading={historyLoading} error={historyError} onLoad={loadDetails} onDelete={deleteHistory} onClear={clearHistory} />
                        : <CustomerInvoiceTab history={history} historyLoading={historyLoading} />}

                    {/* Footer */}
                    <div className="mt-8 mb-6 text-center text-gray-400 text-sm">
                        <div className="w-24 h-px bg-gradient-to-r from-transparent via-asian-gold-dark to-transparent mx-auto mb-3"></div>
                        <p>Safe Cargo Services — Sandy Ground, Anguilla | Declarant: DC2114</p>
                    </div>
                </div>
            );
        }



        // ─── Root: Auth Gate ────────────────────────────────────────────
        function Root() {
            const [authenticated, setAuthenticated] = useState(
                sessionStorage.getItem('scs_auth') === 'authenticated'
            );

            const handleLogin = () => setAuthenticated(true);

            const handleSignOut = () => {
                sessionStorage.removeItem('scs_auth');
                setAuthenticated(false);
            };

            return authenticated
                ? <MainApp onSignOut={handleSignOut} />
                : <LoginPage onLogin={handleLogin} />;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>
</html>
